<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link
      rel="icon"
      type="image/png"
      sizes="32x32"
      href="/images/favicon-1.png"
    />
    <link rel="stylesheet" href="style.css" />
    <title>Flip Card</title>
  </head>
  <body>
    <div class="container">
      <header>
        <h1>Flip Card</h1>
      </header>

      <main>
        <div class="card">
          <div class="card-inner">
            <div class="card-front">front side</div>
            <div class="card-back">back side</div>
          </div>
        </div>
      </main>

      <!-- copyright info -->
      <footer>
        <div id="copy" class="copy"></div>
      </footer>
    </div>

    <script src="script.js"></script>
  </body>
</html>
